<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="A tiny experimental website.">
  <title>hello</title>
  <style>
    :root { color-scheme: dark; --bg: #101114; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2b2c32; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at top, #20212a 0%, var(--bg) 58%);
      color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(680px, calc(100% - 40px)); padding: 56px 0; }
    .tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(56px, 12vw, 104px); line-height: .95; letter-spacing: -.08em; margin: 28px 0 18px; }
    p { max-width: 480px; color: var(--muted); font-size: clamp(16px, 3vw, 19px); line-height: 1.7; }
    .rule { height: 1px; background: var(--line); margin: 38px 0 18px; }
    footer { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
    a { color: var(--fg); text-decoration-color: #666; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">A tiny experiment</span>
    <h1>hello.</h1>
    <p>A small corner of the internet. Nothing fancy — just a simple site, published to see how deployment works.</p>
    <div class="rule"></div>
    <footer>
      <span>Made by Smeet</span>
      <span>Built for the web.</span>
    </footer>
  </main>
</body>
</html>
